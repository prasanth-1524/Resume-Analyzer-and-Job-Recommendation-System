{% extends "base.html" %}{% block title %}Log in{% endblock %}{% block content %}
<section class="panel narrow"><h1>Log in</h1><form method="post"><label>Username</label><input name="username" required autocomplete="username">
<label>Password</label><input type="password" name="password" required autocomplete="current-password"><button class="button full">Log in</button></form>
<p>Need an account? <a href="{{ url_for('register') }}">Register</a></p></section>{% endblock %}
