{% extends "base.html" %}
{% block title %}Create account{% endblock %}
{% block content %}
<div class="auth-card card border-0 shadow-sm p-4 mx-auto">
<h1 class="h3">Create your account</h1><p class="text-muted">Start analyzing your resume.</p>
<form method="post">
  <label class="form-label" for="name">Full name</label><input class="form-control mb-3" id="name" name="name" required maxlength="100">
  <label class="form-label" for="email">Email</label><input class="form-control mb-3" id="email" name="email" type="email" required maxlength="254">
  <label class="form-label" for="password">Password</label><input class="form-control mb-3" id="password" name="password" type="password" minlength="8" required>
  <button class="btn btn-primary w-100">Create account</button>
</form><p class="small mt-3 mb-0">Already registered? <a href="{{ url_for('login') }}">Log in</a></p>
</div>
{% endblock %}
