{% extends "base.html" %}
{% block title %}Log in{% endblock %}
{% block content %}
<div class="auth-card card border-0 shadow-sm p-4 mx-auto">
<h1 class="h3">Welcome back</h1><p class="text-muted">Log in to your ResumeMatch dashboard.</p>
<form method="post">
  <label class="form-label" for="email">Email</label><input class="form-control mb-3" id="email" name="email" type="email" required>
  <label class="form-label" for="password">Password</label><input class="form-control mb-3" id="password" name="password" type="password" required>
  <button class="btn btn-primary w-100">Log in</button>
</form><p class="small mt-3 mb-0">New here? <a href="{{ url_for('register') }}">Create an account</a></p>
</div>
{% endblock %}
